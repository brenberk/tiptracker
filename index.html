<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tip Tracker">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Tip Tracker</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--text:#14181f;--muted:#6b7280;--line:#e6e9ee;--accent:#0f766e;--accent-ink:#fff;--accent-bg:#d9f5f0;--pos:#047857;--danger:#dc2626;--today:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--text:#eef2f6;--muted:#8b97a6;--line:#242d39;--accent:#2dd4bf;--accent-ink:#04201c;--accent-bg:#0f3a36;--pos:#34d399;--danger:#f87171;--today:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
header .sub{color:var(--muted);font-size:13px}
main{padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(72px + env(safe-area-inset-bottom));z-index:9;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.mtitle{font-size:20px;font-weight:700}
.icon{width:40px;height:40px;border-radius:12px;font-size:24px;color:var(--accent);display:flex;align-items:center;justify-content:center}
.icon:active{background:var(--accent-bg)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:19px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:11px;color:var(--muted);padding:2px 0 4px;font-weight:600}
.day{min-height:64px;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
.day.empty{background:transparent;border-color:transparent}
.day .dn{font-size:13px;font-weight:600;align-self:flex-start;padding-left:4px}
.day .dh{font-size:10px;color:var(--muted);margin-top:auto}
.day .dm{font-size:11.5px;font-weight:700;color:var(--pos);letter-spacing:-.03em}
.day.has{background:var(--accent-bg);border-color:transparent}
.day.today{box-shadow:inset 0 0 0 2px var(--today)}
.day:active{transform:scale(.96)}
/* log */
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grp{margin-bottom:14px}
.grp-h{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px 6px}
.grp-h .t{font-weight:700;font-size:15px}
.grp-h .m{color:var(--muted);font-size:12px;margin-top:1px}
.grp-h .tot{font-weight:800;font-size:18px;color:var(--pos);text-align:right}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--accent-bg)}
.row .d{width:42px;text-align:center;line-height:1.1}
.row .d b{display:block;font-size:18px}
.row .d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.row .mid span{font-size:12px;color:var(--muted)}
.row .amt{font-weight:700;font-size:16px}
.empty-msg{text-align:center;color:var(--muted);padding:40px 20px}
/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.big{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;margin-bottom:12px}
.big span{font-size:13px;opacity:.85}
.big b{display:block;font-size:34px;letter-spacing:-.03em}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:16px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}
.bar i.z{background:var(--line);opacity:1}
.bar em{font-style:normal;font-size:9px;color:var(--muted);position:absolute;top:-13px;white-space:nowrap}
.bar b{font-size:9.5px;color:var(--muted);font-weight:500;margin-top:3px;height:12px}
.h3{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px}
.jrow{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.jrow:first-of-type{border-top:0}
.jrow span{color:var(--muted);font-size:13px}
/* settings */
.job{border-top:1px solid var(--line);padding:12px 0}
.job:first-of-type{border-top:0;padding-top:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=time],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;color:var(--text);min-height:44px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.two>*,.three>*,.field{min-width:0}
input[type=text],input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:44px;line-height:1.2;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
input[type=time]{padding-left:10px;padding-right:6px}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;color:var(--text);font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.btn{display:block;width:100%;padding:12px;border-radius:12px;background:var(--accent-bg);color:var(--accent);font-weight:700;text-align:center;margin-top:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
.banner{background:var(--accent-bg);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{font-weight:700;color:var(--accent)}
/* sheet */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;height:100%;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-h h2{margin:0;font-size:20px}
form{display:flex;flex-direction:column;gap:12px}
.preview{background:var(--accent-bg);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;font-weight:700}
.preview span{color:var(--muted);font-weight:500;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.actions.one{grid-template-columns:1fr}
.actions .btn{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--text);line-height:1.2}
.chip small{font-weight:500;font-size:11px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-bg)}
.chip.add{justify-content:center;color:var(--accent);border-style:dashed}
textarea{width:100%;min-height:160px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px/1.4 ui-monospace,Menlo,monospace;color:var(--text);resize:vertical}
.addjob{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header><div><h1 id="ttl">Tip Tracker</h1></div><div class="sub" id="sub"></div></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" data-act="add" aria-label="Add shift">+</button>
<nav class="tabbar" id="tabs">
  <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Calendar</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Log</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-7"/></svg>Stats</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="sheet"></div>
<input type="file" id="importFile" accept=".json,.csv,.tsv,.txt,text/csv,text/plain,application/json" hidden>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => fmtD(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = d => addDays(d, -((d.getDay() + 6) % 7)); // Monday
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0,3));
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWJS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = s => { const x = parseFloat(String(s ?? '').replace(/[$,\s]/g, '')); return isFinite(x) ? x : 0; };
const money = (n, dec = 2) => {
  const r = Math.round(Math.abs(n) * Math.pow(10, dec)) / Math.pow(10, dec);
  const s = r.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  return (n < 0 && r !== 0 ? '-$' : '$') + s;
};
const hrs = h => (Math.round(h * 100) / 100) + 'h';

/* ---------- data ---------- */
const KEY = 'tiptracker.v1';
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.entries) && Array.isArray(s.jobs) && s.jobs.length) return s; } catch (e) {}
  return { entries: [], jobs: [{ id: 'j1', name: 'Serving / Bartending', rate: 0, tipped: true }], lastJob: 'j1', lastBackup: null };
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert('Could not save data. Storage may be full or blocked.'); } }
const jobOf = id => state.jobs.find(j => j.id === id);
const jobName = e => (jobOf(e.jobId) || {}).name || e.jobName || 'Job';

const calc = e => {
  const pay = (e.hours || 0) * (e.rate || 0);
  const tips = (e.cash || 0) + (e.card || 0) - (e.tipOut || 0);
  return { pay, tips, total: pay + tips };
};
function summarize(list) {
  const s = { total: 0, hours: 0, tips: 0, pay: 0, shifts: list.length, days: new Set() };
  for (const e of list) { const c = calc(e); s.total += c.total; s.pay += c.pay; s.tips += c.tips; s.hours += e.hours || 0; s.days.add(e.date); }
  s.perHour = s.hours > 0 ? s.total / s.hours : 0;
  return s;
}
const inRange = (a, b) => state.entries.filter(e => e.date >= a && e.date <= b);

/* ---------- ui state ---------- */
const now = new Date();
const ui = { tab: 'cal', y: now.getFullYear(), m: now.getMonth(), logMode: 'week', statMode: 'week', statOff: 0 };

/* ---------- views ---------- */
function backupBanner() {
  const parts = [];
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && !standalone && !localStorage.getItem('tt.hideInstall')) {
    parts.push(`<div class="banner"><span>Install: tap <b>Share</b> → <b>Add to Home Screen</b>.</span><button data-act="hideInstall">Got it</button></div>`);
  }
  if (state.entries.length >= 5) {
    const last = state.lastBackup ? parseD(state.lastBackup) : null;
    const days = last ? Math.floor((new Date() - last) / 864e5) : 999;
    if (days > 21) parts.push(`<div class="banner"><span>${last ? 'Last backup was ' + days + ' days ago.' : 'You haven\'t backed up yet.'} Export a copy in Settings.</span><button data-tab="set">Open</button></div>`);
  }
  return parts.join('');
}

function viewCal() {
  const { y, m } = ui;
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
  const list = inRange(fmtD(first), fmtD(new Date(y, m, dim)));
  const s = summarize(list);
  const by = {}; list.forEach(e => (by[e.date] = by[e.date] || []).push(e));
  const total = Math.ceil((lead + dim) / 7) * 7;
  let cells = '';
  for (let i = 0; i < total; i++) {
    const dn = i - lead + 1;
    if (dn < 1 || dn > dim) { cells += '<div class="day empty"></div>'; continue; }
    const ds = fmtD(new Date(y, m, dn)), arr = by[ds];
    let inner = `<span class="dn">${dn}</span>`;
    if (arr) { const t = summarize(arr); inner += `<span class="dh">${t.hours ? hrs(t.hours) : '&nbsp;'}</span><span class="dm">${money(t.total, 0)}</span>`; }
    cells += `<button class="day${arr ? ' has' : ''}${ds === todayStr() ? ' today' : ''}" data-act="day" data-date="${ds}">${inner}</button>`;
  }
  return `${backupBanner()}
  <div class="cal-head"><button class="icon" data-act="prevM" aria-label="Previous month">‹</button><button class="mtitle" data-act="thisM">${MONTHS[m]} ${y}</button><button class="icon" data-act="nextM" aria-label="Next month">›</button></div>
  <div class="stats3"><div class="stat"><b>${money(s.total, 0)}</b><span>Earned</span></div><div class="stat"><b>${hrs(s.hours)}</b><span>Hours</span></div><div class="stat"><b>${s.hours ? money(s.perHour) : '—'}</b><span>Per hour</span></div></div>
  <div class="dow">${DOW.map(d => `<div>${d}</div>`).join('')}</div><div class="grid">${cells}</div>`;
}

function weekLabel(ws) {
  const we = addDays(ws, 6);
  return ws.getMonth() === we.getMonth() ? `${MON[ws.getMonth()]} ${ws.getDate()} – ${we.getDate()}` : `${MON[ws.getMonth()]} ${ws.getDate()} – ${MON[we.getMonth()]} ${we.getDate()}`;
}

function viewLog() {
  const sorted = [...state.entries].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const groups = new Map();
  for (const e of sorted) {
    const d = parseD(e.date);
    const key = ui.logMode === 'week' ? fmtD(weekStart(d)) : e.date.slice(0, 7);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  }
  let html = `<div class="seg"><button data-act="logMode" data-v="week" class="${ui.logMode === 'week' ? 'on' : ''}">By week (Mon–Sun)</button><button data-act="logMode" data-v="month" class="${ui.logMode === 'month' ? 'on' : ''}">By month</button></div>`;
  if (!sorted.length) return html + `<div class="empty-msg">No shifts yet.<br>Tap + to add your first one.</div>`;
  for (const [key, list] of groups) {
    const s = summarize(list);
    const label = ui.logMode === 'week' ? weekLabel(parseD(key)) : `${MONTHS[+key.slice(5) - 1]} ${key.slice(0, 4)}`;
    html += `<div class="grp"><div class="grp-h"><div><div class="t">${label}</div><div class="m">${hrs(s.hours)} · ${s.hours ? money(s.perHour) + '/hr' : 'no hours'} · tips ${money(s.tips, 0)}</div></div><div class="tot">${money(s.total)}</div></div><div class="rows">`;
    for (const e of list) {
      const d = parseD(e.date), c = calc(e);
      const sub = [e.hours ? hrs(e.hours) : null, c.tips ? 'tips ' + money(c.tips) : null, e.pay ? null : null].filter(Boolean).join(' · ') || (e.notes || '');
      html += `<button class="row" data-act="edit" data-id="${e.id}"><div class="d"><b>${d.getDate()}</b><span>${DOWJS[d.getDay()]}</span></div><div class="mid"><b>${esc(jobName(e))}</b><span>${esc(sub)}${e.notes && sub !== e.notes ? ' · ' + esc(e.notes) : ''}</span></div><div class="amt">${money(c.total)}</div></button>`;
    }
    html += `</div></div>`;
  }
  return html;
}

function statRange() {
  if (ui.statMode === 'week') {
    const ws = addDays(weekStart(new Date()), ui.statOff * 7);
    return { start: ws, end: addDays(ws, 6), label: weekLabel(ws) + (ui.statOff === 0 ? ' (this week)' : '') };
  }
  const base = new Date(new Date().getFullYear(), new Date().getMonth() + ui.statOff, 1);
  return { start: base, end: new Date(base.getFullYear(), base.getMonth() + 1, 0), label: `${MONTHS[base.getMonth()]} ${base.getFullYear()}` };
}

function viewStats() {
  const r = statRange();
  const list = inRange(fmtD(r.start), fmtD(r.end));
  const s = summarize(list);
  const days = []; for (let d = new Date(r.start); d <= r.end; d = addDays(d, 1)) days.push(d);
  const dayTot = days.map(d => { const ds = fmtD(d); return summarize(list.filter(e => e.date === ds)).total; });
  const max = Math.max(...dayTot, 1);
  const bi = dayTot.indexOf(Math.max(...dayTot));
  const best = dayTot[bi] > 0 ? `${DOWJS[days[bi].getDay()]} ${MON[days[bi].getMonth()]} ${days[bi].getDate()} · ${money(dayTot[bi], 0)}` : '—';

  }).join('');
  const byJob = {};
  for (const e of list) { const k = jobName(e); (byJob[k] = byJob[k] || []).push(e); }
  const jobRows = Object.entries(byJob).map(([k, l]) => { const t = summarize(l); return `<div class="jrow"><div>${esc(k)}<br><span>${hrs(t.hours)} · ${t.hours ? money(t.perHour) + '/hr' : ''}</span></div><b>${money(t.total)}</b></div>`; }).join('');
  return `<div class="seg"><button data-act="statMode" data-v="week" class="${wk ? 'on' : ''}">Week</button><button data-act="statMode" data-v="month" class="${!wk ? 'on' : ''}">Month</button></div>
  <div class="cal-head"><button class="icon" data-act="statPrev">‹</button><button class="mtitle" data-act="statNow" style="font-size:17px">${r.label}</button><button class="icon" data-act="statNext">›</button></div>
  <div class="big"><span>Total earned</span><b>${money(s.total)}</b></div>

    <div class="stat"><b>${hrs(s.hours)}</b><span>Hours worked</span></div>
    <div class="stat"><b>${s.hours ? money(s.perHour) : '—'}</b><span>Average per hour</span></div>
    <div class="stat"><b>${money(s.tips)}</b><span>Tips (after tip-out)</span></div>
    <div class="stat"><b>${money(s.pay)}</b><span>Hourly wages</span></div>
    <div class="stat"><b>${s.shifts}</b><span>Shifts logged</span></div>
    <div class="stat"><b>${s.shifts ? money(s.total / s.shifts) : '—'}</b><span>Average per shift</span></div>
  </div>

  ${jobRows ? `<div class="card"><p class="h3">By job</p>${jobRows}</div>` : ''}`;
}

function addJob() {
  const name = (prompt('Job name?') || '').trim();
  if (!name) return null;
  const rate = num(prompt('Hourly wage ($)? Enter 0 if none.', '0'));
  const tipped = confirm('Does this job include tips?\n\nOK = yes, Cancel = no');
  const j = { id: uid(), name, rate, tipped };
  state.jobs.push(j); state.lastJob = j.id; save();
  return j;
}

/* ---------- export / import ---------- */
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (err) { if (err && err.name === 'AbortError') return false; }
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}
async function exportJSON() {
  const ok = await shareFile(`tip-tracker-backup-${todayStr()}.json`, JSON.stringify(state, null, 2), 'application/json');
  if (ok) { state.lastBackup = todayStr(); save(); render(); }
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Date','Job','Hours','Hourly rate','Wages','Cash tips','Card tips','Tip-out','Total','Notes']];
  [...state.entries].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { const c = calc(e); rows.push([e.date, jobName(e), e.hours, e.rate, c.pay.toFixed(2), e.cash, e.card, e.tipOut, c.total.toFixed(2), e.notes || '']); });
  shareFile(`tip-tracker-${todayStr()}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}
function restoreJSON(text) {
  try {
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.entries)) throw new Error('bad');
    const ids = new Set(state.entries.map(e => e.id)), jids = new Set(state.jobs.map(j => j.id));
    let n = 0;
    (data.jobs || []).forEach(j => { if (j && j.id && !jids.has(j.id)) { state.jobs.push(j); } });
    data.entries.forEach(e => { if (e && e.id && e.date && !ids.has(e.id)) { state.entries.push(e); n++; } });
    save(); render(); alert(`Restored ${n} shift${n === 1 ? '' : 's'}.`);
  } catch (e) { alert('That file doesn\'t look like a Tip Tracker backup.'); }
}

/* ---------- CSV / spreadsheet import ---------- */
function parseTable(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const cnt = ch => first.split(ch).length - 1;
  const delim = [['\t', cnt('\t')], [';', cnt(';')], [',', cnt(',')]].sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const HDR = {
  date: /^(date|day|shift date|work date)$/,
  job: /^(job|position|role|employer|workplace|place|restaurant|bar|location)$/,
  hours: /^(hours?|hrs?|hours worked|total hours)$/,
  start: /^(start|start time|clock in|time in|in)$/,
  end: /^(end|end time|clock out|time out|out)$/,
  rate: /^(rate|hourly|hourly rate|hourly wage|wage|pay rate|base|base pay rate)$/,
  cash: /^(cash|cash tips?)$/,
  card: /^(card|credit|card tips?|credit tips?|cc tips?|credit card tips?)$/,
  tips: /^(tips?|total tips?|tips earned)$/,
  tipOut: /^(tip ?out|tip share|tips? shared|tips? out|tipped out)$/,
  total: /^(total|earned|earnings|income|total earned|amount|pay|total pay)$/,
  notes: /^(notes?|memo|comments?|description)$/
};
const normH = h => String(h).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function dateLoose(s) {
  s = String(s || '').trim(); let m;
  const ok = (y, mo, d) => { const dt = new Date(y, mo - 1, d); return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d ? fmtD(dt) : null; };
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return ok(y, +m[1], +m[2]); }
  if (/\d{4}/.test(s)) { const d = new Date(s); if (!isNaN(d)) return fmtD(d); }
  return null;
}
function timeMins(s) {
  const m = String(s || '').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])?m?$/i);
  if (!m) return null;
  let h = +m[1]; const mi = +(m[2] || 0), ap = (m[3] || '').toLowerCase();
  if (ap === 'p' && h < 12) h += 12; if (ap === 'a' && h === 12) h = 0;
  return h * 60 + mi;
}
let pendingImport = null;
function buildImport(rows) {
  if (rows.length < 2) return { error: 'I found a header but no shifts. The first row should be headers, then one shift per row.' };
  const col = {};
  rows[0].map(normH).forEach((h, i) => { for (const k in HDR) if (!(k in col) && HDR[k].test(h)) { col[k] = i; break; } });
  if (!('date' in col)) return { error: 'I couldn\'t find a Date column. The first row needs headers like Date, Hours, Cash tips, Card tips.' };
  const get = (r, k) => (k in col ? (r[col[k]] || '') : '');
  const keyOf = e => [e.date, (e.jobName || '').toLowerCase(), e.hours, e.rate, e.cash, e.card, e.tipOut].join('|');
  const seen = new Set(state.entries.map(e => keyOf({ ...e, jobName: jobName(e) })));
  const out = [], newJobs = {}; let skipped = 0, dupes = 0, flat = 0;
  const defJob = jobOf(state.lastJob) || state.jobs[0];
  for (const r of rows.slice(1)) {
    const date = dateLoose(get(r, 'date'));
    if (!date) { skipped++; continue; }
    let hours = num(get(r, 'hours'));
    if (!hours && 'start' in col && 'end' in col) {
      const a = timeMins(get(r, 'start')), b = timeMins(get(r, 'end'));
      if (a !== null && b !== null) { let m = b - a; if (m <= 0) m += 1440; hours = Math.round(m / 60 * 100) / 100; }
    }
    const name = String(get(r, 'job')).trim() || defJob.name;
    const existing = state.jobs.find(j => j.name.toLowerCase() === name.toLowerCase());
    let rate = String(get(r, 'rate')).trim() !== '' ? num(get(r, 'rate')) : (existing ? existing.rate : 0);
    let cash = num(get(r, 'cash')), card = num(get(r, 'card'));
    const tipsOnly = num(get(r, 'tips'));
    if (!cash && !card && tipsOnly) card = tipsOnly;
    const tipOut = num(get(r, 'tipOut'));
    const total = num(get(r, 'total'));
    if (!hours && !cash && !card && total > 0) { cash = total; flat++; }
    if (!hours && !cash && !card) { skipped++; continue; }
    const e = { id: uid(), date, jobName: name, hours, rate, cash, card, tipOut, notes: String(get(r, 'notes')).trim() };
    const k = keyOf(e);
    if (seen.has(k)) { dupes++; continue; }
    seen.add(k); out.push(e);
    if (!existing && !newJobs[name.toLowerCase()]) newJobs[name.toLowerCase()] = { name, rate, tipped: !!(cash || card || tipOut) };
  }
  if (!out.length) return { error: `No new shifts to import (${skipped} skipped, ${dupes} already in the app).` };
  return { entries: out, newJobs: Object.values(newJobs), skipped, dupes, flat };
}
function startImport(text) {
  const res = buildImport(parseTable(text));
  if (res.error) { alert(res.error); return; }
  pendingImport = res;
  const dates = res.entries.map(e => e.date).sort();
  const s = summarize(res.entries);
  openSheet(`<div class="sheet-h"><h2>Import ${res.entries.length} shift${res.entries.length === 1 ? '' : 's'}?</h2><button class="icon" data-close>✕</button></div>
  <div class="card" style="margin-bottom:10px"><div class="jrow"><span>Date range</span><b>${dates[0]} → ${dates[dates.length - 1]}</b></div>
    <div class="jrow"><span>Hours</span><b>${hrs(s.hours)}</b></div>
    <div class="jrow"><span>Total earned</span><b>${money(s.total)}</b></div>
    ${res.newJobs.length ? `<div class="jrow"><span>New job presets</span><b>${res.newJobs.map(j => esc(j.name)).join(', ')}</b></div>` : ''}
    ${res.dupes ? `<div class="jrow"><span>Already in app (skipped)</span><b>${res.dupes}</b></div>` : ''}
    ${res.skipped ? `<div class="jrow"><span>Rows skipped (no date or amounts)</span><b>${res.skipped}</b></div>` : ''}
  </div>
  ${res.flat ? `<p class="note" style="margin-bottom:10px">${res.flat} row${res.flat === 1 ? ' only had' : 's only had'} a total with no hours or tips, so ${res.flat === 1 ? 'it was' : 'they were'} imported as cash tips.</p>` : ''}
  <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-act="commitImport">Import</button></div>`);
}
function commitImport() {
  if (!pendingImport) return;
  const p = pendingImport; pendingImport = null;
  const byName = {};
  state.jobs.forEach(j => byName[j.name.toLowerCase()] = j);
  p.newJobs.forEach(nj => { const j = { id: uid(), name: nj.name, rate: nj.rate, tipped: nj.tipped }; state.jobs.push(j); byName[j.name.toLowerCase()] = j; });
  p.entries.forEach(e => { const j = byName[e.jobName.toLowerCase()]; e.jobId = j ? j.id : state.jobs[0].id; state.entries.push(e); });
  save(); closeSheet();
  const last = p.entries.map(e => e.date).sort().pop(); const d = parseD(last); ui.y = d.getFullYear(); ui.m = d.getMonth();
  render();
  alert(`Imported ${p.entries.length} shift${p.entries.length === 1 ? '' : 's'}.`);
}
function pasteSheet() {
  openSheet(`<div class="sheet-h"><h2>Paste your data</h2><button class="icon" data-close>✕</button></div>
  <p class="note" style="margin:0 0 10px">Copy rows from a spreadsheet (include the header row) and paste below.</p>
  <textarea id="pasteBox" placeholder="Date	Job	Hours	Cash tips	Card tips&#10;10/20/2026	Bar	6.5	80	120"></textarea>
  <div class="actions" style="margin-top:12px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-act="pasteGo">Preview import</button></div>`);
}
function csvTemplate() {
  const t = 'Date,Job,Start,End,Hours,Rate,Cash tips,Card tips,Tip-out,Notes\n2026-10-20,Serving / Bartending,17:00,23:30,6.5,5,80,120,25,\n2026-10-25,Day job,09:00,14:00,5,18,,,,\n';
  shareFile('tip-tracker-template.csv', t, 'text/csv');
}
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  const text = await f.text();
  if (text.trim().startsWith('{')) restoreJSON(text); else startImport(text);
});

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.id === 'ov' || t.closest('[data-close]')) { closeSheet(); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, ds = a.dataset;
  switch (act) {
    case 'add': entrySheet(null, ui.tab === 'cal' && (ui.y !== now.getFullYear() || ui.m !== now.getMonth()) ? fmtD(new Date(ui.y, ui.m, 1)) : todayStr()); break;
    case 'addOn': entrySheet(null, ds.date); break;
    case 'day': daySheet(ds.date); break;
    case 'edit': entrySheet(ds.id); break;
    case 'prevM': ui.m--; if (ui.m < 0) { ui.m = 11; ui.y--; } render(); break;
    case 'nextM': ui.m++; if (ui.m > 11) { ui.m = 0; ui.y++; } render(); break;
    case 'thisM': ui.y = now.getFullYear(); ui.m = now.getMonth(); render(); break;
    case 'logMode': ui.logMode = ds.v; render(); break;
    case 'statMode': ui.statMode = ds.v; ui.statOff = 0; render(); break;
    case 'statPrev': ui.statOff--; render(); break;
    case 'statNext': ui.statOff++; render(); break;
    case 'statNow': ui.statOff = 0; render(); break;
    case 'addJob': if (addJob()) render(); break;
    case 'delJob':
      if (confirm('Delete this job? Past shifts keep their records.')) { state.jobs = state.jobs.filter(j => j.id !== ds.id); if (state.lastJob === ds.id) state.lastJob = state.jobs[0].id; save(); render(); }
      break;
    case 'exportJSON': exportJSON(); break;
    case 'exportCSV': exportCSV(); break;
    case 'importJSON': case 'importCSV': $('#importFile').click(); break;
    case 'pasteImport': pasteSheet(); break;
    case 'pasteGo': { const t = $('#pasteBox').value; if (!t.trim()) { alert('Paste your rows first.'); break; } startImport(t); break; }
    case 'commitImport': commitImport(); break;
    case 'csvTemplate': csvTemplate(); break;
    case 'saveJob': {
      const name = $('#nj_name').value.trim();
      if (!name) { alert('Give the preset a name.'); break; }
      if (state.jobs.some(j => j.name.toLowerCase() === name.toLowerCase())) { alert('You already have a preset with that name.'); break; }
      state.jobs.push({ id: uid(), name, rate: num($('#nj_rate').value), tipped: $('#nj_tipped').checked });
      save(); render(); break;
    }
    case 'hideInstall': try { localStorage.setItem('tt.hideInstall', '1'); } catch (e) {} render(); break;
    case 'wipe':
      if (confirm('Delete ALL shifts and jobs? This cannot be undone.') && confirm('Really delete everything? Make sure you have a backup.')) {
        state = { entries: [], jobs: [{ id: 'j1', name: 'Serving / Bartending', rate: 0, tipped: true }], lastJob: 'j1', lastBackup: state.lastBackup }; save(); render();
      }
      break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target, row = el.closest('[data-job]');
  if (!row || !el.dataset.f) return;
  const j = jobOf(row.dataset.job); if (!j) return;
  if (el.dataset.f === 'name') j.name = el.value.trim() || j.name;
  if (el.dataset.f === 'rate') j.rate = num(el.value);
  if (el.dataset.f === 'tipped') j.tipped = el.checked;
  save();
});

/* ---------- start ---------- */
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
