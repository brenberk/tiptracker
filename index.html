<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tip Tracker">
<meta name="theme-color" content="#1D6A49">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="archivo.woff2" as="font" type="font/woff2" crossorigin>
<title>Tip Tracker</title>
<style>
@font-face{font-family:"Archivo TT";src:url(archivo.woff2) format("woff2-variations"),url(archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
/* Guest-check palette: green-ruled server pad by day, bottle green after close */
:root{
  --paper:#EBF0E7;--sheet:#F9FBF6;--rule:#CFDCCB;--rule-2:#A9BFAD;
  --ink:#16231C;--muted:#5D6D63;--faint:#8A998F;
  --green:#1D6A49;--green-2:#2E8A61;--on-green:#F4FBF6;--wash:#DCEADF;
  --red:#C2362A;--shadow:0 1px 0 rgba(22,35,28,.04),0 10px 30px -18px rgba(22,35,28,.35);
  --r:16px;--r-s:10px;
  --f:"Archivo TT",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0D1712;--sheet:#14211A;--rule:#22342A;--rule-2:#36503F;
  --ink:#E5EEE7;--muted:#97A99D;--faint:#6C8072;
  --green:#5CC38F;--green-2:#7AD6A6;--on-green:#08130D;--wash:#183526;
  --red:#FF7867;--shadow:0 12px 30px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,a,label,.day,.line,.chip,.fab,.tabbar{touch-action:manipulation}
button,.day,.line,.chip,.fab,.tabbar,header,.seg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.4 var(--f);font-stretch:100%;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;font-stretch:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
b{font-weight:650}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(140px + env(safe-area-inset-bottom))}
main{padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:30px;line-height:1.05;font-weight:800;font-stretch:118%;letter-spacing:-.015em}
.ttl-btn{font-weight:800;font-stretch:118%;display:flex;align-items:baseline;gap:8px;text-align:left}
.ttl-btn .yr{font-size:17px;font-weight:500;font-stretch:100%;color:var(--faint);letter-spacing:0}
.hdr-r{display:flex;align-items:center;gap:4px}
.nav{width:38px;height:38px;border-radius:50%;font-size:26px;line-height:1;color:var(--green);display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.nav:active{background:var(--wash)}
.today-btn{font-size:14px;font-weight:600;color:var(--green);padding:7px 10px;border-radius:99px;background:var(--wash);margin-right:4px}

/* hero figure */
.hero{padding:4px 2px 18px}
.hero-n{font-size:52px;line-height:1;font-weight:760;font-stretch:112%;letter-spacing:-.03em;color:var(--green)}
.hero-meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;color:var(--muted);font-size:15px}
.hero-meta b{color:var(--ink);font-weight:650}

/* calendar: one ruled pad */
.cal{background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--rule)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--rule-2)}
.dow div{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:9px 0 7px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule)}
.day{position:relative;min-height:68px;background:var(--sheet);padding:5px 5px 6px;display:flex;flex-direction:column;align-items:stretch;text-align:left;min-width:0}
.day.empty{background:var(--paper);opacity:.55}
.day .dn{font-size:13px;font-weight:600;color:var(--muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:-2px 0 0 -2px;border-radius:50%}
.day .dh{margin-top:auto;font-size:11px;font-stretch:75%;color:var(--faint);text-align:right;line-height:1.1}
.day .dm{font-size:15.5px;font-weight:700;font-stretch:72%;color:var(--green);text-align:right;line-height:1.15;letter-spacing:-.01em;white-space:nowrap}
.day.has .dn{color:var(--ink)}
.day.today .dn{color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red);font-weight:700}
.day:active{background:var(--wash)}

/* segmented control */
.seg{display:flex;background:var(--rule);border-radius:12px;padding:3px;margin:2px 0 16px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* log: each group is a guest check */
.check{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.check-h{padding:14px 16px 10px;border-bottom:1px solid var(--rule-2);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.check-h h2{margin:0;font-size:18px;font-weight:750;font-stretch:112%;letter-spacing:-.01em}
.check-sub{font-size:13px;color:var(--muted);text-align:right}
.lines{display:flex;flex-direction:column}
.line{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--rule);text-align:left;width:100%}
.line:first-child{border-top:0}
.line:active{background:var(--wash)}
.line .date{width:34px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.line .date b{font-size:21px;font-weight:700;font-stretch:80%}
.line .date small{font-size:11px;color:var(--faint);font-weight:500}
.line .what{flex:1;min-width:0;display:flex;flex-direction:column}
.line .what b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .what small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .amt{font-size:16px;font-weight:650}
.check-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 14px;border-top:3px double var(--rule-2)}
.check-total span{font-size:14px;color:var(--muted);font-weight:600}
.check-total b{font-size:20px;font-weight:760;font-stretch:108%;color:var(--green)}

/* stats */
.period{display:flex;align-items:center;justify-content:space-between;margin:0 -4px 6px}
.period-t{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.period-t b{font-size:17px;font-weight:700}
.period-t small{font-size:12.5px;color:var(--muted)}
.period + .hero{text-align:center}
.period + .hero .hero-meta{justify-content:center}
.panel-s{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.panel-s.quiet{box-shadow:none;background:transparent;text-align:center;border-style:dashed}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:18px}
.chart.wk{gap:10px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.bar i{display:block;width:100%;background:var(--green-2);opacity:.55;border-radius:5px 5px 2px 2px;min-height:2px}
.bar.best i{opacity:1;background:var(--green)}
.bar i.z{background:var(--rule);opacity:1}
.bar em{font-style:normal;font-size:10.5px;font-stretch:78%;font-weight:600;color:var(--muted);position:absolute;top:-16px;white-space:nowrap}
.bar.best em{color:var(--green)}
.bar b{font-size:10.5px;color:var(--faint);font-weight:500;margin-top:5px;height:13px}
.caption{margin:12px 0 0;font-size:13.5px;color:var(--muted)}
.ledger{padding-top:4px;padding-bottom:4px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.lrow:first-child{border-top:0}
.lrow span{color:var(--muted);font-size:15px;display:flex;flex-direction:column}
.lrow span small{font-size:12.5px;color:var(--faint);margin-top:1px}
.lrow b{font-size:16px;font-weight:650}
.lrow.sum{border-top:3px double var(--rule-2);margin-top:2px}
.lrow.sum span{color:var(--ink);font-weight:600}
.lrow.sum b{font-size:19px;font-weight:760;font-stretch:108%;color:var(--green)}
.ledger .lrow:first-child span{color:var(--muted)}

/* section headings */
.sec{margin:22px 4px 8px;font-size:15px;font-weight:700;color:var(--ink)}
.sec.first{margin-top:4px}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:-4px 4px 4px}
.hint{color:var(--muted);font-size:14.5px;text-align:center;padding:22px 24px;margin:0}

/* settings */
.job{padding:4px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.job:last-of-type{margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=date],input[type=time],select{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:46px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-s);padding:0 12px;font-size:16px;font-weight:500;color:var(--ink);text-align:left;line-height:1.2}
input::placeholder{color:var(--faint);font-weight:400}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--wash)}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
input[type=time]{padding:0 6px 0 10px}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.5}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.two>*,.three>*{min-width:0}
.toggle{display:flex;align-items:center;gap:10px;align-self:end;height:46px;font-size:15px;font-weight:500;color:var(--ink)}
.toggle input{width:22px;height:22px;accent-color:var(--green);margin:0}
.link{font-size:14px;font-weight:600;color:var(--green);padding:10px 0 0}
.link.danger{color:var(--red)}
.panel-s.quiet .link{padding:2px 0}
details.addjob summary{list-style:none;cursor:pointer;font-weight:600;color:var(--green);padding:6px 0 2px;font-size:15px}
details.addjob summary::-webkit-details-marker{display:none}
details.addjob summary::before{content:"+";display:inline-block;width:18px;font-weight:700}
details.addjob[open] summary{margin-bottom:10px}
details.addjob .btn{margin-top:12px}
.btn{display:block;width:100%;height:48px;border-radius:12px;background:var(--wash);color:var(--green);font-weight:650;font-size:15.5px;text-align:center}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.banner{background:var(--wash);border-radius:12px;padding:11px 14px;font-size:14px;margin:0 0 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.banner button{font-weight:700;color:var(--green);white-space:nowrap}

/* tab bar and add button */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--sheet) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;max-width:140px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--green)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;width:58px;height:58px;border-radius:20px;background:var(--green);color:var(--on-green);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 24px -10px color-mix(in srgb,var(--green) 70%,transparent),0 2px 4px rgba(0,0,0,.12)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.fab:active{transform:scale(.95)}

/* bottom sheet */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;height:100%;background:rgba(8,16,12,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out}
.panel{background:var(--sheet);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.panel::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--rule-2);margin:0 auto 10px}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{background:transparent}}
@media (prefers-reduced-motion:reduce){.overlay,.panel{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-h h2{margin:0;font-size:22px;font-weight:780;font-stretch:112%;letter-spacing:-.01em}
.x{width:34px;height:34px;border-radius:50%;background:var(--rule);color:var(--muted);display:flex;align-items:center;justify-content:center}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
form{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font-weight:650;font-size:14.5px;color:var(--ink);line-height:1.2;text-align:left}
.chip small{font-weight:500;font-size:12px;color:var(--muted)}
.chip.on{background:var(--wash);box-shadow:inset 0 0 0 2px var(--green)}
.chip.add{justify-content:center;color:var(--green);box-shadow:inset 0 0 0 1px var(--rule-2);background:transparent}
.receipt{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px 2px;border-top:3px double var(--rule-2)}
.receipt span{font-size:15px;color:var(--muted);font-weight:600}
.receipt b{font-size:26px;font-weight:780;font-stretch:110%;color:var(--green);letter-spacing:-.02em}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.actions.one{grid-template-columns:1fr}
.day-lines{border:1px solid var(--rule);border-radius:14px;overflow:hidden;margin-bottom:14px}
textarea{width:100%;min-height:160px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-s);padding:10px 12px;font-size:14px;line-height:1.4;color:var(--ink);resize:vertical}
.imp{margin-bottom:12px}
.imp .lrow span{font-size:14.5px}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1 id="ttl">Tip Tracker</h1><div class="hdr-r" id="hdrR"></div></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" data-act="add" aria-label="Add shift"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabbar" id="tabs">
  <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Calendar</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Log</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-7"/></svg>Stats</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="sheet"></div>
<input type="file" id="importFile" accept=".json,.csv,.tsv,.txt,text/csv,text/plain,application/json" hidden>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => fmtD(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = d => addDays(d, -((d.getDay() + 6) % 7)); // Monday
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0,3));
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWJS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = s => { const x = parseFloat(String(s ?? '').replace(/[$,\s]/g, '')); return isFinite(x) ? x : 0; };
const money = (n, dec = 2) => {
  const r = Math.round(Math.abs(n) * Math.pow(10, dec)) / Math.pow(10, dec);
  const s = r.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  return (n < 0 && r !== 0 ? '-$' : '$') + s;
};
const hrs = h => (Math.round(h * 100) / 100) + 'h';

/* ---------- data ---------- */
const KEY = 'tiptracker.v1';
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.entries) && Array.isArray(s.jobs) && s.jobs.length) return s; } catch (e) {}
  return { entries: [], jobs: [{ id: 'j1', name: 'Serving / Bartending', rate: 0, tipped: true }], lastJob: 'j1', lastBackup: null };
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert('Could not save data. Storage may be full or blocked.'); } }
const jobOf = id => state.jobs.find(j => j.id === id);
const jobName = e => (jobOf(e.jobId) || {}).name || e.jobName || 'Job';

const calc = e => {
  const pay = (e.hours || 0) * (e.rate || 0);
  const tips = (e.cash || 0) + (e.card || 0) - (e.tipOut || 0);
  return { pay, tips, total: pay + tips };
};
function summarize(list) {
  const s = { total: 0, hours: 0, tips: 0, pay: 0, shifts: list.length, days: new Set() };
  for (const e of list) { const c = calc(e); s.total += c.total; s.pay += c.pay; s.tips += c.tips; s.hours += e.hours || 0; s.days.add(e.date); }
  s.perHour = s.hours > 0 ? s.total / s.hours : 0;
  return s;
}
const inRange = (a, b) => state.entries.filter(e => e.date >= a && e.date <= b);

/* ---------- ui state ---------- */
const now = new Date();
const ui = { tab: 'cal', y: now.getFullYear(), m: now.getMonth(), logMode: 'week', statMode: 'week', statOff: 0 };

/* ---------- views ---------- */
const hrsWord = h => { const v = Math.round(h * 100) / 100; return v + (v === 1 ? ' hour' : ' hours'); };

function backupBanner() {
  const parts = [];
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let hide = false; try { hide = !!localStorage.getItem('tt.hideInstall'); } catch (e) {}
  if (ios && !standalone && !hide) {
    parts.push(`<div class="banner"><span>To install, tap <b>Share</b>, then <b>Add to Home Screen</b>.</span><button data-act="hideInstall">Got it</button></div>`);
  }
  if (state.entries.length >= 5) {
    const last = state.lastBackup ? parseD(state.lastBackup) : null;
    const days = last ? Math.floor((new Date() - last) / 864e5) : 999;
    if (days > 21) parts.push(`<div class="banner"><span>${last ? 'Your last backup was ' + days + ' days ago.' : 'You haven\'t backed up yet.'}</span><button data-tab="set">Back up</button></div>`);
  }
  return parts.join('');
}

function heroTotal(s, label) {
  return `<section class="hero">
    <div class="hero-n">${money(s.total, s.total % 1 ? 2 : 0)}</div>
    <div class="hero-meta"><span><b>${s.hours ? Math.round(s.hours * 100) / 100 : 0}</b> hours</span><span><b>${s.hours ? money(s.perHour) : '–'}</b> an hour</span>${label ? `<span>${label}</span>` : ''}</div>
  </section>`;
}

function viewCal() {
  const { y, m } = ui;
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
  const list = inRange(fmtD(first), fmtD(new Date(y, m, dim)));
  const s = summarize(list);
  const by = {}; list.forEach(e => (by[e.date] = by[e.date] || []).push(e));
  const total = Math.ceil((lead + dim) / 7) * 7;
  const today = todayStr();
  let cells = '';
  for (let i = 0; i < total; i++) {
    const dn = i - lead + 1;
    if (dn < 1 || dn > dim) { cells += '<div class="day empty"></div>'; continue; }
    const ds = fmtD(new Date(y, m, dn)), arr = by[ds];
    let inner = `<span class="dn">${dn}</span>`;
    if (arr) { const t = summarize(arr); inner += `<span class="dh">${t.hours ? Math.round(t.hours * 100) / 100 + 'h' : ''}</span><span class="dm">${money(t.total, 0)}</span>`; }
    cells += `<button class="day${arr ? ' has' : ''}${ds === today ? ' today' : ''}" data-act="day" data-date="${ds}" aria-label="${MONTHS[m]} ${dn}${arr ? ', ' + money(summarize(arr).total) : ''}">${inner}</button>`;
  }
  return `${backupBanner()}
  ${heroTotal(s, s.shifts ? `${s.shifts} shift${s.shifts === 1 ? '' : 's'}` : '')}
  <div class="cal">
    <div class="dow">${DOW.map(d => `<div>${d.slice(0, 2)}</div>`).join('')}</div>
    <div class="grid">${cells}</div>
  </div>
  ${list.length ? '' : `<p class="hint">Nothing logged in ${MONTHS[m]}. Tap a day or the + button to add a shift.</p>`}`;
}

function weekLabel(ws) {
  const we = addDays(ws, 6);
  return ws.getMonth() === we.getMonth() ? `${MON[ws.getMonth()]} ${ws.getDate()}–${we.getDate()}` : `${MON[ws.getMonth()]} ${ws.getDate()} – ${MON[we.getMonth()]} ${we.getDate()}`;
}

function seg(act, cur, opts) {
  return `<div class="seg" role="tablist">${opts.map(([v, l]) => `<button role="tab" aria-selected="${cur === v}" data-act="${act}" data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}

function viewLog() {
  const sorted = [...state.entries].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const groups = new Map();
  for (const e of sorted) {
    const d = parseD(e.date);
    const key = ui.logMode === 'week' ? fmtD(weekStart(d)) : e.date.slice(0, 7);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  }
  let html = seg('logMode', ui.logMode, [['week', 'Weeks (Mon–Sun)'], ['month', 'Months']]);
  if (!sorted.length) return html + `<p class="hint">No shifts yet. Tap + to log your first one, or import your old data in Settings.</p>`;
  for (const [key, list] of groups) {
    const s = summarize(list);
    const label = ui.logMode === 'week' ? weekLabel(parseD(key)) : `${MONTHS[+key.slice(5) - 1]} ${key.slice(0, 4)}`;
    html += `<section class="check">
      <header class="check-h"><h2>${label}</h2><span class="check-sub">${hrsWord(s.hours)}${s.hours ? ', ' + money(s.perHour) + ' an hour' : ''}</span></header>
      <div class="lines">`;
    for (const e of list) {
      const d = parseD(e.date), c = calc(e);
      const bits = [];
      if (e.hours) bits.push(Math.round(e.hours * 100) / 100 + 'h');
      if (c.tips) bits.push(money(c.tips) + ' tips');
      if (c.pay) bits.push(money(c.pay) + ' wages');
      if (e.notes) bits.push(esc(e.notes));
      html += `<button class="line" data-act="edit" data-id="${e.id}">
        <span class="date"><b>${d.getDate()}</b><small>${DOWJS[d.getDay()]}</small></span>
        <span class="what"><b>${esc(jobName(e))}</b><small>${bits.join(', ')}</small></span>
        <span class="amt">${money(c.total)}</span></button>`;
    }
    html += `</div><footer class="check-total"><span>Total</span><b>${money(s.total)}</b></footer></section>`;
  }
  return html;
}

function statRange() {
  if (ui.statMode === 'week') {
    const ws = addDays(weekStart(new Date()), ui.statOff * 7);
    return { start: ws, end: addDays(ws, 6), label: ui.statOff === 0 ? 'This week' : ui.statOff === -1 ? 'Last week' : weekLabel(ws), sub: weekLabel(ws) };
  }
  const base = new Date(new Date().getFullYear(), new Date().getMonth() + ui.statOff, 1);
  return { start: base, end: new Date(base.getFullYear(), base.getMonth() + 1, 0), label: `${MONTHS[base.getMonth()]} ${base.getFullYear()}`, sub: ui.statOff === 0 ? 'This month' : '' };
}

function viewStats() {
  const r = statRange();
  const list = inRange(fmtD(r.start), fmtD(r.end));
  const s = summarize(list);
  const days = []; for (let d = new Date(r.start); d <= r.end; d = addDays(d, 1)) days.push(d);
  const dayTot = days.map(d => { const ds = fmtD(d); return summarize(list.filter(e => e.date === ds)).total; });
  const max = Math.max(...dayTot, 1);
  const bi = dayTot.indexOf(Math.max(...dayTot));
  const best = dayTot[bi] > 0 ? `${DOWJS[days[bi].getDay()]}, ${MON[days[bi].getMonth()]} ${days[bi].getDate()}` : '';
  const wk = ui.statMode === 'week';
  const bars = days.map((d, i) => {
    const t = dayTot[i], h = t > 0 ? Math.max(4, t / max * 100) : 0;
    const lab = wk ? DOW[i].slice(0, 2) : (d.getDate() === 1 || d.getDate() % 5 === 0 ? d.getDate() : '');
    return `<div class="bar${i === bi && t > 0 ? ' best' : ''}">${wk && t > 0 ? `<em>${money(t, 0)}</em>` : ''}<i class="${t > 0 ? '' : 'z'}" style="height:${t > 0 ? h : 2}%"></i><b>${lab}</b></div>`;
  }).join('');
  const byJob = {};
  for (const e of list) { const k = jobName(e); (byJob[k] = byJob[k] || []).push(e); }
  const jobs = Object.entries(byJob).sort((a, b) => summarize(b[1]).total - summarize(a[1]).total);
  const row = (k, v) => `<div class="lrow"><span>${k}</span><b>${v}</b></div>`;
  return `${seg('statMode', ui.statMode, [['week', 'Week'], ['month', 'Month']])}
  <div class="period"><button class="nav" data-act="statPrev" aria-label="Previous">‹</button><button class="period-t" data-act="statNow"><b>${r.label}</b>${r.sub && r.sub !== r.label ? `<small>${r.sub}</small>` : ''}</button><button class="nav" data-act="statNext" aria-label="Next">›</button></div>
  ${heroTotal(s, '')}
  <section class="panel-s">
    <div class="chart${wk ? ' wk' : ''}">${bars}</div>
    ${best ? `<p class="caption">Best day was ${best}, ${money(dayTot[bi])}.</p>` : `<p class="caption">No shifts in this ${wk ? 'week' : 'month'}.</p>`}
  </section>
  <section class="panel-s ledger">
    ${row('Tips, after tip-out', money(s.tips))}
    ${row('Hourly wages', money(s.pay))}
    ${row('Shifts', s.shifts)}
    ${row('Average shift', s.shifts ? money(s.total / s.shifts) : '–')}
    <div class="lrow sum"><span>Total</span><b>${money(s.total)}</b></div>
  </section>
  ${jobs.length > 1 ? `<h3 class="sec">By job</h3><section class="panel-s ledger">${jobs.map(([k, l]) => { const t = summarize(l); return `<div class="lrow"><span>${esc(k)}<small>${hrsWord(t.hours)}${t.hours ? ', ' + money(t.perHour) + ' an hour' : ''}</small></span><b>${money(t.total)}</b></div>`; }).join('')}</section>` : ''}`;
}

function viewSettings() {
  const jobs = state.jobs.map(j => `<div class="job" data-job="${j.id}">
    <label class="field">Name<input type="text" data-f="name" value="${esc(j.name)}"></label>
    <div class="two"><label class="field">Hourly wage<input type="text" inputmode="decimal" data-f="rate" value="${j.rate || ''}" placeholder="$0.00"></label>
    <label class="toggle"><input type="checkbox" data-f="tipped" ${j.tipped ? 'checked' : ''}><span>Gets tips</span></label></div>
    ${state.jobs.length > 1 ? `<button class="link danger" data-act="delJob" data-id="${j.id}">Delete ${esc(j.name)}</button>` : ''}
  </div>`).join('');
  return `<h3 class="sec first">Job presets</h3>
  <section class="panel-s">${jobs}
    <details class="addjob"><summary>Add a job</summary>
      <label class="field">Name<input type="text" id="nj_name" placeholder="Day job, catering…"></label>
      <div class="two"><label class="field">Hourly wage<input type="text" inputmode="decimal" id="nj_rate" placeholder="$0.00"></label>
      <label class="toggle"><input type="checkbox" id="nj_tipped"><span>Gets tips</span></label></div>
      <button class="btn primary" data-act="saveJob">Add job</button></details>
  </section>
  <p class="note">Presets fill in the wage when you add a shift. Changing a wage only affects new shifts, and deleting a job keeps its past shifts.</p>

  <h3 class="sec">Backup</h3>
  <section class="panel-s">
    <button class="btn primary" data-act="exportJSON">Back up now</button>
    <div class="btn-row"><button class="btn" data-act="importJSON">Restore a backup</button><button class="btn" data-act="exportCSV">Export CSV</button></div>
  </section>
  <p class="note">${state.lastBackup ? 'Last backup ' + state.lastBackup + '. ' : 'No backup yet. '}Your shifts are stored only on this phone, so save a backup to Files or iCloud now and then.</p>

  <h3 class="sec">Import from another app</h3>
  <section class="panel-s">
    <button class="btn" data-act="importCSV">Import a CSV file</button>
    <div class="btn-row"><button class="btn" data-act="pasteImport">Paste rows</button><button class="btn" data-act="csvTemplate">Get template</button></div>
  </section>
  <p class="note">The first row needs headers such as Date, Job, Hours, Rate, Cash tips, Card tips, Tip-out and Notes. Importing the same rows twice won't duplicate them.</p>

  <section class="panel-s quiet"><button class="link danger" data-act="wipe">Delete all data</button></section>`;
}

const TITLES = { cal: '', log: 'Log', stats: 'Stats', set: 'Settings' };
function render() {
  const v = $('#view');
  const fn = { cal: viewCal, log: viewLog, stats: viewStats, set: viewSettings }[ui.tab];
  const st = window.scrollY;
  v.innerHTML = fn();
  document.querySelectorAll('#tabs button').forEach(b => { const on = b.dataset.tab === ui.tab; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  $('#fab').style.display = ui.tab === 'set' ? 'none' : 'flex';
  const t = $('#ttl'), hr = $('#hdrR');
  if (ui.tab === 'cal') {
    const cur = ui.y === now.getFullYear() && ui.m === now.getMonth();
    t.innerHTML = `<button data-act="thisM" class="ttl-btn">${MONTHS[ui.m]}<span class="yr">${ui.y}</span></button>`;
    hr.innerHTML = `${cur ? '' : '<button class="today-btn" data-act="thisM">Today</button>'}<button class="nav" data-act="prevM" aria-label="Previous month">‹</button><button class="nav" data-act="nextM" aria-label="Next month">›</button>`;
  } else { t.textContent = TITLES[ui.tab]; hr.innerHTML = ''; }
  window.scrollTo(0, st);
}

/* ---------- sheets ---------- */
function openSheet(html) {
  $('#sheet').innerHTML = `<div class="overlay" id="ov"><div class="panel">${html}</div></div>`;
}
function closeSheet() { $('#sheet').innerHTML = ''; }

function daySheet(date) {
  const list = state.entries.filter(e => e.date === date);
  if (!list.length) return entrySheet(null, date);
  const d = parseD(date), s = summarize(list);
  openSheet(`<div class="sheet-h"><h2>${DOWJS[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}</h2><button class="x" data-close aria-label="Close"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
  <div class="day-lines">${list.map(e => { const c = calc(e); const bits = []; if (e.hours) bits.push(Math.round(e.hours * 100) / 100 + 'h'); if (c.tips) bits.push(money(c.tips) + ' tips'); if (c.pay) bits.push(money(c.pay) + ' wages'); return `<button class="line" data-act="edit" data-id="${e.id}"><span class="what"><b>${esc(jobName(e))}</b><small>${bits.join(', ') || 'Tap to edit'}</small></span><span class="amt">${money(c.total)}</span></button>`; }).join('')}</div>
  <div class="receipt" style="margin-bottom:16px"><span>${hrsWord(s.hours)}</span><b>${money(s.total)}</b></div>
  <div class="actions one"><button class="btn" data-act="addOn" data-date="${date}">Add another shift</button></div>`);
}

function entrySheet(id, date) {
  const e = id ? state.entries.find(x => x.id === id) : null;
  const d = e ? e.date : (date || todayStr());
  const jobId = e && jobOf(e.jobId) ? e.jobId : (jobOf(state.lastJob) ? state.lastJob : state.jobs[0].id);
  const job = jobOf(jobId);
  const v = x => x ? x : '';
  const chips = state.jobs.map(j => `<button type="button" class="chip${j.id === jobId ? ' on' : ''}" data-chip="${j.id}">${esc(j.name)}<small>${j.rate ? money(j.rate) + ' an hour' : (j.tipped ? 'Tips only' : 'No wage set')}${j.rate && j.tipped ? ' + tips' : ''}</small></button>`).join('') + '<button type="button" class="chip add" data-chip="__new">New job</button>';
  openSheet(`<div class="sheet-h"><h2>${e ? 'Edit shift' : 'Add shift'}</h2><button class="x" data-close aria-label="Close"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
  <form id="ef" autocomplete="off" novalidate>
    <label class="field">Date<input type="date" id="f_date" value="${d}"></label>
    <div class="field">Job<div class="chips" id="chips">${chips}</div><input type="hidden" id="f_job" value="${jobId}"></div>
    <div class="three">
      <label class="field">Start<input type="time" id="f_start"></label>
      <label class="field">End<input type="time" id="f_end"></label>
      <label class="field">Hours<input type="text" inputmode="decimal" id="f_hours" value="${v(e ? e.hours : '')}" placeholder="0"></label>
    </div>
    <label class="field">Hourly wage<input type="text" inputmode="decimal" id="f_rate" value="${v(e ? e.rate : job.rate)}" placeholder="$0.00"></label>
    <div id="tipfields" style="display:${job.tipped ? 'flex' : 'none'};flex-direction:column;gap:12px">
      <div class="three">
        <label class="field">Cash tips<input type="text" inputmode="decimal" id="f_cash" value="${v(e ? e.cash : '')}" placeholder="0"></label>
        <label class="field">Card tips<input type="text" inputmode="decimal" id="f_card" value="${v(e ? e.card : '')}" placeholder="0"></label>
        <label class="field">Tip-out<input type="text" inputmode="decimal" id="f_out" value="${v(e ? e.tipOut : '')}" placeholder="0"></label>
      </div>
    </div>
    <label class="field">Notes<input type="text" id="f_notes" value="${esc(e ? e.notes : '')}"></label>
    <div class="receipt"><span>Shift total</span><b id="pv">$0.00</b></div>
    <div class="actions${e ? '' : ' one'}">${e ? '<button type="button" class="btn danger" id="del">Delete</button>' : ''}<button type="submit" class="btn primary">${e ? 'Save changes' : 'Save shift'}</button></div>
  </form>`);
  const g = s => $('#f_' + s);
  const fields = () => {
    const j = jobOf(g('job').value) || job;
    const rec = { hours: num(g('hours').value), rate: num(g('rate').value) };
    if (j.tipped) { rec.cash = num(g('cash').value); rec.card = num(g('card').value); rec.tipOut = num(g('out').value); }
    return rec;
  };
  const preview = () => { $('#pv').textContent = money(calc(fields()).total); };
  const autoHours = () => {
    const s = g('start').value, en = g('end').value;
    if (!s || !en) return;
    const tm = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
    let mins = tm(en) - tm(s); if (mins <= 0) mins += 1440;
    g('hours').value = Math.round(mins / 60 * 100) / 100;
  };
  $('#chips').addEventListener('click', ev => {
    const b = ev.target.closest('[data-chip]'); if (!b) return;
    if (b.dataset.chip === '__new') { if (addJob()) entrySheet(id, g('date').value); return; }
    const j = jobOf(b.dataset.chip); if (!j) return;
    g('job').value = j.id;
    document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.chip === j.id));
    g('rate').value = j.rate || '';
    $('#tipfields').style.display = j.tipped ? 'flex' : 'none';
    preview();
  });
  $('#ef').addEventListener('input', ev => { if (ev.target.id === 'f_start' || ev.target.id === 'f_end') autoHours(); preview(); });
  preview();
  if (e) $('#del').addEventListener('click', () => {
    if (confirm('Delete this shift?')) { state.entries = state.entries.filter(x => x.id !== e.id); save(); closeSheet(); render(); }
  });
  $('#ef').addEventListener('submit', ev => {
    ev.preventDefault();
    const j = jobOf(g('job').value) || job;
    const date = g('date').value;
    if (!date) { alert('Pick a date.'); return; }
    const f = fields();
    const rec = { id: e ? e.id : uid(), date, jobId: j.id, jobName: j.name, hours: f.hours, rate: f.rate, cash: f.cash || 0, card: f.card || 0, tipOut: f.tipOut || 0, notes: g('notes').value.trim() };
    if (f.hours === 0 && calc(rec).total === 0) { alert('Enter hours or tips first.'); return; }
    if (e) state.entries = state.entries.map(x => x.id === e.id ? rec : x); else state.entries.push(rec);
    state.lastJob = j.id; save(); closeSheet();
    const nd = parseD(date); ui.y = nd.getFullYear(); ui.m = nd.getMonth();
    render();
  });
}

function addJob() {
  const name = (prompt('Job name?') || '').trim();
  if (!name) return null;
  const rate = num(prompt('Hourly wage ($)? Enter 0 if none.', '0'));
  const tipped = confirm('Does this job include tips?\n\nOK = yes, Cancel = no');
  const j = { id: uid(), name, rate, tipped };
  state.jobs.push(j); state.lastJob = j.id; save();
  return j;
}

/* ---------- export / import ---------- */
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (err) { if (err && err.name === 'AbortError') return false; }
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}
async function exportJSON() {
  const ok = await shareFile(`tip-tracker-backup-${todayStr()}.json`, JSON.stringify(state, null, 2), 'application/json');
  if (ok) { state.lastBackup = todayStr(); save(); render(); }
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Date','Job','Hours','Hourly rate','Wages','Cash tips','Card tips','Tip-out','Total','Notes']];
  [...state.entries].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { const c = calc(e); rows.push([e.date, jobName(e), e.hours, e.rate, c.pay.toFixed(2), e.cash, e.card, e.tipOut, c.total.toFixed(2), e.notes || '']); });
  shareFile(`tip-tracker-${todayStr()}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}
function restoreJSON(text) {
  try {
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.entries)) throw new Error('bad');
    const ids = new Set(state.entries.map(e => e.id)), jids = new Set(state.jobs.map(j => j.id));
    let n = 0;
    (data.jobs || []).forEach(j => { if (j && j.id && !jids.has(j.id)) { state.jobs.push(j); } });
    data.entries.forEach(e => { if (e && e.id && e.date && !ids.has(e.id)) { state.entries.push(e); n++; } });
    save(); render(); alert(`Restored ${n} shift${n === 1 ? '' : 's'}.`);
  } catch (e) { alert('That file doesn\'t look like a Tip Tracker backup.'); }
}

/* ---------- CSV / spreadsheet import ---------- */
function parseTable(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const cnt = ch => first.split(ch).length - 1;
  const delim = [['\t', cnt('\t')], [';', cnt(';')], [',', cnt(',')]].sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const HDR = {
  date: /^(date|day|shift date|work date)$/,
  job: /^(job|position|role|employer|workplace|place|restaurant|bar|location)$/,
  hours: /^(hours?|hrs?|hours worked|total hours)$/,
  start: /^(start|start time|clock in|time in|in)$/,
  end: /^(end|end time|clock out|time out|out)$/,
  rate: /^(rate|hourly|hourly rate|hourly wage|wage|pay rate|base|base pay rate)$/,
  cash: /^(cash|cash tips?)$/,
  card: /^(card|credit|card tips?|credit tips?|cc tips?|credit card tips?)$/,
  tips: /^(tips?|total tips?|tips earned)$/,
  tipOut: /^(tip ?out|tip share|tips? shared|tips? out|tipped out)$/,
  total: /^(total|earned|earnings|income|total earned|amount|pay|total pay)$/,
  notes: /^(notes?|memo|comments?|description)$/
};
const normH = h => String(h).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function dateLoose(s) {
  s = String(s || '').trim(); let m;
  const ok = (y, mo, d) => { const dt = new Date(y, mo - 1, d); return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d ? fmtD(dt) : null; };
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return ok(y, +m[1], +m[2]); }
  if (/\d{4}/.test(s)) { const d = new Date(s); if (!isNaN(d)) return fmtD(d); }
  return null;
}
function timeMins(s) {
  const m = String(s || '').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])?m?$/i);
  if (!m) return null;
  let h = +m[1]; const mi = +(m[2] || 0), ap = (m[3] || '').toLowerCase();
  if (ap === 'p' && h < 12) h += 12; if (ap === 'a' && h === 12) h = 0;
  return h * 60 + mi;
}
let pendingImport = null;
function buildImport(rows) {
  if (rows.length < 2) return { error: 'I found a header but no shifts. The first row should be headers, then one shift per row.' };
  const col = {};
  rows[0].map(normH).forEach((h, i) => { for (const k in HDR) if (!(k in col) && HDR[k].test(h)) { col[k] = i; break; } });
  if (!('date' in col)) return { error: 'I couldn\'t find a Date column. The first row needs headers like Date, Hours, Cash tips, Card tips.' };
  const get = (r, k) => (k in col ? (r[col[k]] || '') : '');
  const keyOf = e => [e.date, (e.jobName || '').toLowerCase(), e.hours, e.rate, e.cash, e.card, e.tipOut].join('|');
  const seen = new Set(state.entries.map(e => keyOf({ ...e, jobName: jobName(e) })));
  const out = [], newJobs = {}; let skipped = 0, dupes = 0, flat = 0;
  const defJob = jobOf(state.lastJob) || state.jobs[0];
  for (const r of rows.slice(1)) {
    const date = dateLoose(get(r, 'date'));
    if (!date) { skipped++; continue; }
    let hours = num(get(r, 'hours'));
    if (!hours && 'start' in col && 'end' in col) {
      const a = timeMins(get(r, 'start')), b = timeMins(get(r, 'end'));
      if (a !== null && b !== null) { let m = b - a; if (m <= 0) m += 1440; hours = Math.round(m / 60 * 100) / 100; }
    }
    const name = String(get(r, 'job')).trim() || defJob.name;
    const existing = state.jobs.find(j => j.name.toLowerCase() === name.toLowerCase());
    let rate = String(get(r, 'rate')).trim() !== '' ? num(get(r, 'rate')) : (existing ? existing.rate : 0);
    let cash = num(get(r, 'cash')), card = num(get(r, 'card'));
    const tipsOnly = num(get(r, 'tips'));
    if (!cash && !card && tipsOnly) card = tipsOnly;
    const tipOut = num(get(r, 'tipOut'));
    const total = num(get(r, 'total'));
    if (!hours && !cash && !card && total > 0) { cash = total; flat++; }
    if (!hours && !cash && !card) { skipped++; continue; }
    const e = { id: uid(), date, jobName: name, hours, rate, cash, card, tipOut, notes: String(get(r, 'notes')).trim() };
    const k = keyOf(e);
    if (seen.has(k)) { dupes++; continue; }
    seen.add(k); out.push(e);
    if (!existing && !newJobs[name.toLowerCase()]) newJobs[name.toLowerCase()] = { name, rate, tipped: !!(cash || card || tipOut) };
  }
  if (!out.length) return { error: `No new shifts to import (${skipped} skipped, ${dupes} already in the app).` };
  return { entries: out, newJobs: Object.values(newJobs), skipped, dupes, flat };
}
function startImport(text) {
  const res = buildImport(parseTable(text));
  if (res.error) { alert(res.error); return; }
  pendingImport = res;
  const dates = res.entries.map(e => e.date).sort();
  const s = summarize(res.entries);
  openSheet(`<div class="sheet-h"><h2>Import ${res.entries.length} shift${res.entries.length === 1 ? '' : 's'}?</h2><button class="x" data-close aria-label="Close"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
  <div class="panel-s ledger imp"><div class="lrow"><span>Dates</span><b>${dates[0]} to ${dates[dates.length - 1]}</b></div>
    <div class="lrow"><span>Hours</span><b>${hrs(s.hours)}</b></div>
    <div class="lrow"><span>Total earned</span><b>${money(s.total)}</b></div>
    ${res.newJobs.length ? `<div class="lrow"><span>New job presets</span><b>${res.newJobs.map(j => esc(j.name)).join(', ')}</b></div>` : ''}
    ${res.dupes ? `<div class="lrow"><span>Already in app (skipped)</span><b>${res.dupes}</b></div>` : ''}
    ${res.skipped ? `<div class="lrow"><span>Rows skipped (no date or amounts)</span><b>${res.skipped}</b></div>` : ''}
  </div>
  ${res.flat ? `<p class="note" style="margin-bottom:10px">${res.flat} row${res.flat === 1 ? ' only had' : 's only had'} a total with no hours or tips, so ${res.flat === 1 ? 'it was' : 'they were'} imported as cash tips.</p>` : ''}
  <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-act="commitImport">Import shifts</button></div>`);
}
function commitImport() {
  if (!pendingImport) return;
  const p = pendingImport; pendingImport = null;
  const byName = {};
  state.jobs.forEach(j => byName[j.name.toLowerCase()] = j);
  p.newJobs.forEach(nj => { const j = { id: uid(), name: nj.name, rate: nj.rate, tipped: nj.tipped }; state.jobs.push(j); byName[j.name.toLowerCase()] = j; });
  p.entries.forEach(e => { const j = byName[e.jobName.toLowerCase()]; e.jobId = j ? j.id : state.jobs[0].id; state.entries.push(e); });
  save(); closeSheet();
  const last = p.entries.map(e => e.date).sort().pop(); const d = parseD(last); ui.y = d.getFullYear(); ui.m = d.getMonth();
  render();
  alert(`Imported ${p.entries.length} shift${p.entries.length === 1 ? '' : 's'}.`);
}
function pasteSheet() {
  openSheet(`<div class="sheet-h"><h2>Paste your data</h2><button class="x" data-close aria-label="Close"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
  <p class="note" style="margin:0 0 10px">Copy rows from a spreadsheet (include the header row) and paste below.</p>
  <textarea id="pasteBox" placeholder="Date	Job	Hours	Cash tips	Card tips&#10;10/20/2026	Bar	6.5	80	120"></textarea>
  <div class="actions" style="margin-top:12px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-act="pasteGo">Preview import</button></div>`);
}
function csvTemplate() {
  const t = 'Date,Job,Start,End,Hours,Rate,Cash tips,Card tips,Tip-out,Notes\n2026-10-20,Serving / Bartending,17:00,23:30,6.5,5,80,120,25,\n2026-10-25,Day job,09:00,14:00,5,18,,,,\n';
  shareFile('tip-tracker-template.csv', t, 'text/csv');
}
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  const text = await f.text();
  if (text.trim().startsWith('{')) restoreJSON(text); else startImport(text);
});

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.id === 'ov' || t.closest('[data-close]')) { closeSheet(); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, ds = a.dataset;
  switch (act) {
    case 'add': entrySheet(null, ui.tab === 'cal' && (ui.y !== now.getFullYear() || ui.m !== now.getMonth()) ? fmtD(new Date(ui.y, ui.m, 1)) : todayStr()); break;
    case 'addOn': entrySheet(null, ds.date); break;
    case 'day': daySheet(ds.date); break;
    case 'edit': entrySheet(ds.id); break;
    case 'prevM': ui.m--; if (ui.m < 0) { ui.m = 11; ui.y--; } render(); break;
    case 'nextM': ui.m++; if (ui.m > 11) { ui.m = 0; ui.y++; } render(); break;
    case 'thisM': ui.y = now.getFullYear(); ui.m = now.getMonth(); render(); break;
    case 'logMode': ui.logMode = ds.v; render(); break;
    case 'statMode': ui.statMode = ds.v; ui.statOff = 0; render(); break;
    case 'statPrev': ui.statOff--; render(); break;
    case 'statNext': ui.statOff++; render(); break;
    case 'statNow': ui.statOff = 0; render(); break;
    case 'addJob': if (addJob()) render(); break;
    case 'delJob':
      if (confirm('Delete this job? Past shifts keep their records.')) { state.jobs = state.jobs.filter(j => j.id !== ds.id); if (state.lastJob === ds.id) state.lastJob = state.jobs[0].id; save(); render(); }
      break;
    case 'exportJSON': exportJSON(); break;
    case 'exportCSV': exportCSV(); break;
    case 'importJSON': case 'importCSV': $('#importFile').click(); break;
    case 'pasteImport': pasteSheet(); break;
    case 'pasteGo': { const t = $('#pasteBox').value; if (!t.trim()) { alert('Paste your rows first.'); break; } startImport(t); break; }
    case 'commitImport': commitImport(); break;
    case 'csvTemplate': csvTemplate(); break;
    case 'saveJob': {
      const name = $('#nj_name').value.trim();
      if (!name) { alert('Give the preset a name.'); break; }
      if (state.jobs.some(j => j.name.toLowerCase() === name.toLowerCase())) { alert('You already have a preset with that name.'); break; }
      state.jobs.push({ id: uid(), name, rate: num($('#nj_rate').value), tipped: $('#nj_tipped').checked });
      save(); render(); break;
    }
    case 'hideInstall': try { localStorage.setItem('tt.hideInstall', '1'); } catch (e) {} render(); break;
    case 'wipe':
      if (confirm('Delete ALL shifts and jobs? This cannot be undone.') && confirm('Really delete everything? Make sure you have a backup.')) {
        state = { entries: [], jobs: [{ id: 'j1', name: 'Serving / Bartending', rate: 0, tipped: true }], lastJob: 'j1', lastBackup: state.lastBackup }; save(); render();
      }
      break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target, row = el.closest('[data-job]');
  if (!row || !el.dataset.f) return;
  const j = jobOf(row.dataset.job); if (!j) return;
  if (el.dataset.f === 'name') j.name = el.value.trim() || j.name;
  if (el.dataset.f === 'rate') j.rate = num(el.value);
  if (el.dataset.f === 'tipped') j.tipped = el.checked;
  save();
});

/* ---------- start ---------- */
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
